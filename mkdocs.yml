# The reference website, todo-reference.md 7.1 and plan 009 sections 1 and 3. Built from `reference/`
# alone; the archive, `docs/findings.md`, is published beside it one page per section by
# `tools/site/hooks.py`, which also rewrites every link that leaves `reference/`. The built site is never
# committed (`site/` is in `.gitignore`); `make site` builds it locally and a GitHub Action will publish it
# (todo-reference.md 7.2).
#
# **Strict by default, switchable.** Every check below is at warning level, and in strict mode a single
# warning fails the build: a broken link, a broken anchor, a page in `reference/` the navigation leaves
# out, a page the navigation names that does not exist, and anything the hook could not place. That is
# what makes the build a guard on every link from chapter 3 of todo-reference.md on. The reference is not
# finished yet, so the same build with `SITE_STRICT=false` (`make site SITE_STRICT=false`) reports the same
# warnings and still writes the site. Use that until todo-reference.md chapters 3 and 4 have made the
# strict build pass, then never again.

site_name: How a Harmony works
site_description: >-
  A reference to the Logitech Harmony remotes: what they do, how their configuration files and their USB
  protocol work, and what is known about each model, with the evidence for every fact.
site_url: https://dannybloe.github.io/harmony-explorations/
repo_url: https://github.com/dannybloe/harmony-explorations
repo_name: harmony-explorations
edit_uri: edit/main/reference/

docs_dir: reference
site_dir: site

strict: !ENV [SITE_STRICT, true]

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

hooks:
  - tools/site/hooks.py

theme:
  name: material
  # One override: a remote's drawing above the contents column on each of its pages, tools/site/hooks.py.
  custom_dir: tools/site/overrides
  features:
    # The top level of the navigation as tabs, the reader's order of plan 009 section 1.
    - navigation.tabs
    - navigation.sections
    # A folder's README is that section's own page rather than a child of it.
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode

# Material's built in search, and nothing that reaches the network at build time: the social cards and
# the privacy plugin would fetch, and none is wanted (tools/site/requirements.txt).
plugins:
  - search

markdown_extensions:
  # The evidence form of plan 009 section 4 is a named footnote.
  - footnotes
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details

# The order a reader meets, plan 009 section 1, "The website's navigation". Pages the plan names that do
# not exist yet are listed all the same, so the strict build reports each until its step writes it.
